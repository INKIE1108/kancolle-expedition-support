name: Dispatch Kancolle Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron-dispatch
        env:
          APP_URL: ${{ vars.KANCOLLE_APP_URL || 'https://kancolle-expedition-support.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Run URL=${APP_URL}"
          curl --fail -X POST "${APP_URL}/api/cron-dispatch" \
            -H "Authorization: Bearer ${CRON_SECRET}"
