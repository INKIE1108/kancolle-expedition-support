name: GitHub Pages deployment (disabled)

# This project is deployed to Vercel. Keeping the old Pages workflow on every
# push caused a 404 from actions/deploy-pages when GitHub Pages was not enabled,
# which in turn generated failure emails. It is now manual and always succeeds.
on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment target
        run: |
          echo "GitHub Pages deployment is disabled because production is hosted on Vercel."
          echo "If you later want GitHub Pages too, enable Pages in repository Settings > Pages and restore the deploy workflow."
